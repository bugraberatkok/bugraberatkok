<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Experience</title>
  <desc id="desc">IdeaSoft: Frontend Developer Intern, Mar – Sep 2025. TNC Group: Project-based software engineering training, Jul – Aug 2026. Egemsoft: Software testing and test automation intern, Jul – Aug 2026. Ailways: Software Developer Intern, Sep 2026 – present. Next level: coming soon.</desc>
  <defs>
    <clipPath id="card"><rect x="1.5" y="1.5" width="1197" height="387" rx="19"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.4px; fill: #5E5873; }
    .title { font-size: 40px; font-weight: 700; letter-spacing: -.8px; fill: #1F1A33; }
    .platform { fill: #EFECF7; stroke: #D3CBE8; stroke-width: 1.5; }
    .grass { fill: #5A4A94; }
    .lv { fill: none; stroke: #D3CBE8; stroke-width: 1.5; }
    .lv-text { font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #5E5873; }
    .company { font-size: 22px; font-weight: 700; fill: #1F1A33; }
    .role { font-size: 15px; fill: #5E5873; }
    .date { font-size: 15px; font-weight: 600; fill: #5A4A94; }
    .ghost rect { fill: none; stroke: #D3CBE8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .ghost-title { font-size: 22px; font-weight: 700; letter-spacing: 2px; fill: #D3CBE8; }
    .ghost-note { font-size: 15px; font-style: italic; fill: #5E5873; }
    .hud { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #5E5873; }
    .xp-track { fill: #E2DDF0; }
    .xp-fill { fill: #F5C84C; transform-box: fill-box; transform-origin: left center; animation: xp 12s infinite; }
    .hero { animation: hero 12s infinite; }
    .bob { animation: bob .5s ease-in-out infinite alternate; }
    .gain { font-size: 16px; font-weight: 700; fill: #5A4A94; opacity: 0; animation: gain 12s linear infinite; }
    .bug-egem { transform-box: fill-box; transform-origin: center bottom; animation: squash 12s linear infinite; }
    .legs { animation: wiggle .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .lv-now { fill: #F5C84C; stroke: #F5C84C; }
    .lv-now-text { fill: #1F1A33; }
    .mystery { animation: float 1.4s ease-in-out infinite alternate; }
    .mystery rect { fill: #F5C84C; stroke: #1F1A33; stroke-opacity: .25; stroke-width: 2; }
    .mystery text { font-size: 22px; font-weight: 800; fill: #1F1A33; }
    .locked { opacity: 0; animation: locked 12s linear infinite; }
    .locked text { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #D93A3F; }
    .lock-body { fill: #D93A3F; }
    .lock-arc { fill: none; stroke: #D93A3F; stroke-width: 3; }
    .bubble { opacity: 0; animation: bubble 12s linear infinite; }
    .bubble rect { fill: #EFECF7; stroke: #D3CBE8; stroke-width: 1.5; }
    .bubble text { font-size: 15px; font-weight: 600; fill: #1F1A33; }
    .dot { animation: blink 1.2s steps(1) infinite; }
    .dot:nth-of-type(2) { animation-delay: .3s; }
    .dot:nth-of-type(3) { animation-delay: .6s; }

    @keyframes hero { 0% { transform: translate(144px, 216px); opacity: 0; } 2.50% { opacity: 1; } 0.00% { transform: translate(144.0px, 216.0px); } 12.50% { transform: translate(144.0px, 216.0px); } 13.50% { transform: translate(176.1px, 176.4px); } 14.83% { transform: translate(218.9px, 143.2px); } 15.83% { transform: translate(251.0px, 133.0px); } 16.83% { transform: translate(283.1px, 135.4px); } 18.17% { transform: translate(325.9px, 158.2px); } 19.17% { transform: translate(358.0px, 190.0px); } 31.67% { transform: translate(358.0px, 190.0px); } 32.67% { transform: translate(390.1px, 150.4px); } 34.00% { transform: translate(432.9px, 117.2px); } 35.00% { transform: translate(465.0px, 107.0px); } 36.00% { transform: translate(497.1px, 109.4px); } 37.33% { transform: translate(539.9px, 132.2px); } 38.33% { transform: translate(572.0px, 164.0px); } 50.83% { transform: translate(572.0px, 164.0px); } 51.83% { transform: translate(610.1px, 124.4px); } 53.17% { transform: translate(660.9px, 91.2px); } 54.17% { transform: translate(699.0px, 81.0px); } 55.17% { transform: translate(737.1px, 83.4px); } 56.50% { transform: translate(787.9px, 106.2px); } 57.50% { transform: translate(826.0px, 138.0px); } 68.33% { transform: translate(826.0px, 138.0px); } 70.17% { transform: translate(860.0px, 104.0px); } 71.67% { transform: translate(867.0px, 96.0px); } 72.92% { transform: translate(851.0px, 108.0px); } 75.00% { transform: translate(832.0px, 138.0px); } 75.83% { transform: translate(826.0px, 138.0px); } 94.17% { transform: translate(826.0px, 138.0px); opacity: 1; } 98.33% { transform: translate(826.0px, 138.0px); opacity: 0; } 100% { transform: translate(144px, 216px); opacity: 0; } }
    @keyframes xp { 0% { transform: scaleX(.01); } 0.00% { transform: scaleX(0.01); } 3.33% { transform: scaleX(0.04); } 19.17% { transform: scaleX(0.04); } 22.50% { transform: scaleX(0.08); } 38.33% { transform: scaleX(0.08); } 41.67% { transform: scaleX(0.12); } 57.50% { transform: scaleX(0.12); } 60.83% { transform: scaleX(0.16); } 96.67% { transform: scaleX(.16); } 100% { transform: scaleX(.01); } }
    @keyframes gain { 0% { opacity: 0; transform: translateY(8px); } 2%, 9% { opacity: 1; transform: none; } 12%, 100% { opacity: 0; transform: translateY(-12px); } }
    @keyframes squash { 0%, 37.92% { opacity: 1; transform: none; } 39.17% { opacity: 1; transform: scaleY(.15); } 42.50%, 97% { opacity: 0; transform: scaleY(.15); } 100% { opacity: 1; transform: none; } }
    @keyframes wiggle { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes bob { from { transform: none; } to { transform: translateY(-3px); } }
    @keyframes float { from { transform: none; } to { transform: translateY(-6px); } }
    @keyframes wave { from { transform: skewY(-6deg); } to { transform: skewY(6deg); } }
    @keyframes locked { 0%, 71.25% { opacity: 0; transform: none; } 71.67% { opacity: 1; transform: translateX(-4px); } 72.50% { transform: translateX(4px); } 73.33% { transform: translateX(-2px); } 74.17%, 85.00% { opacity: 1; transform: none; } 87.50%, 100% { opacity: 0; } }
    @keyframes bubble { 0%, 77.50% { opacity: 0; transform: translateY(6px); } 80.00%, 92% { opacity: 1; transform: none; } 95%, 100% { opacity: 0; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: .2; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .hero { transform: translate(826px, 138px); }
      .bubble { opacity: 1; }
    }
  </style>

