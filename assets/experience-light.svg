<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Experience</title>
  <desc id="desc">IdeaSoft: Frontend Developer Intern, Mar – Sep 2025. TNC Group: Project-based software engineering training, Jul – Aug 2026. Egemsoft: Software testing and test automation intern, Jul – Aug 2026. Ailways: Software Developer Intern, Sep 2026 – present.</desc>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.4px; fill: #5E5873; }
    .title { font-size: 40px; font-weight: 700; letter-spacing: -.8px; fill: #1F1A33; }
    .platform { fill: #EFECF7; stroke: #D3CBE8; stroke-width: 1.5; }
    .grass { fill: #5A4A94; }
    .lv { fill: none; stroke: #D3CBE8; stroke-width: 1.5; }
    .lv-text { font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #5E5873; }
    .company { font-size: 22px; font-weight: 700; fill: #1F1A33; }
    .role { font-size: 16px; fill: #5E5873; }
    .date { font-size: 15px; font-weight: 600; fill: #5A4A94; }
    .hud { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #5E5873; }
    .xp-track { fill: #E2DDF0; }
    .xp-fill { fill: #F5C84C; transform-box: fill-box; transform-origin: left center; animation: xp 12s infinite; }
    .hero { animation: hero 12s infinite; }
    .bob { animation: bob .5s ease-in-out infinite alternate; }
    .gain { font-size: 16px; font-weight: 700; fill: #5A4A94; opacity: 0; animation: gain 12s linear infinite; }
    .bug-egem { transform-box: fill-box; transform-origin: center bottom; animation: squash 12s linear infinite; }
    .legs { animation: wiggle .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .flag { fill: #F5C84C; transform-box: fill-box; transform-origin: left center; animation: wave 1.2s ease-in-out infinite alternate; }
    .flag-text { font-size: 11px; font-weight: 800; letter-spacing: 1px; fill: #1F1A33; }
    .bubble { opacity: 0; animation: bubble 12s linear infinite; }
    .bubble rect { fill: #EFECF7; stroke: #D3CBE8; stroke-width: 1.5; }
    .bubble text { font-size: 15px; font-weight: 600; fill: #1F1A33; }
    .dot { animation: blink 1.2s steps(1) infinite; }
    .dot:nth-of-type(2) { animation-delay: .3s; }
    .dot:nth-of-type(3) { animation-delay: .6s; }

    @keyframes hero { 0% { transform: translate(151px, 208px); opacity: 0; } 2.50% { opacity: 1; } 0.00% { transform: translate(151px, 208px); } 12.50% { transform: translate(151px, 208px); } 13.50% { transform: translate(192.4px, 168.1px); } 14.83% { transform: translate(247.6px, 134.5px); } 15.83% { transform: translate(289.0px, 124.0px); } 16.83% { transform: translate(330.4px, 126.1px); } 18.17% { transform: translate(385.6px, 148.5px); } 19.17% { transform: translate(427px, 180px); } 31.67% { transform: translate(427px, 180px); } 32.67% { transform: translate(468.4px, 140.1px); } 34.00% { transform: translate(523.6px, 106.5px); } 35.00% { transform: translate(565.0px, 96.0px); } 36.00% { transform: translate(606.4px, 98.1px); } 37.33% { transform: translate(661.6px, 120.5px); } 38.33% { transform: translate(703px, 152px); } 50.83% { transform: translate(703px, 152px); } 51.83% { transform: translate(744.4px, 112.1px); } 53.17% { transform: translate(799.6px, 78.5px); } 54.17% { transform: translate(841.0px, 68.0px); } 55.17% { transform: translate(882.4px, 70.1px); } 56.50% { transform: translate(937.6px, 92.5px); } 57.50% { transform: translate(979px, 124px); } 94.17% { transform: translate(979px, 124px); opacity: 1; } 98.33% { transform: translate(979px, 124px); opacity: 0; } 100% { transform: translate(151px, 208px); opacity: 0; } }
    @keyframes xp { 0% { transform: scaleX(.02); } 0.00% { transform: scaleX(0); } 3.33% { transform: scaleX(0.25); } 19.17% { transform: scaleX(0.25); } 22.50% { transform: scaleX(0.5); } 38.33% { transform: scaleX(0.5); } 41.67% { transform: scaleX(0.75); } 57.50% { transform: scaleX(0.75); } 60.83% { transform: scaleX(0.92); } 96.67% { transform: scaleX(.92); } 100% { transform: scaleX(.02); } }
    @keyframes gain { 0% { opacity: 0; transform: translateY(8px); } 2%, 9% { opacity: 1; transform: none; } 12%, 100% { opacity: 0; transform: translateY(-12px); } }
    @keyframes squash { 0%, 37.92% { opacity: 1; transform: none; } 39.17% { opacity: 1; transform: scaleY(.15); } 42.50%, 97% { opacity: 0; transform: scaleY(.15); } 100% { opacity: 1; transform: none; } }
    @keyframes wiggle { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes bob { from { transform: none; } to { transform: translateY(-3px); } }
    @keyframes wave { from { transform: skewY(-6deg); } to { transform: skewY(6deg); } }
    @keyframes bubble { 0%, 70% { opacity: 0; transform: translateY(6px); } 73%, 92% { opacity: 1; transform: none; } 95%, 100% { opacity: 0; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: .2; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .hero { transform: translate(979px, 124px); }
      .bubble { opacity: 1; }
    }
  </style>

