<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Experience</title>
  <desc id="desc">IdeaSoft: Frontend Developer Intern, Mar – Sep 2025. Egemsoft: Software testing and test automation intern, Jul – Aug 2026, alongside the TNC Group project-based software engineering training in the evenings (web, mobile, SQL). Ailways: Software Developer Intern, Sep 2026 – present. Next level: coming soon.</desc>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.4px; fill: #5E5873; }
    .title { font-size: 40px; font-weight: 700; letter-spacing: -.8px; fill: #1F1A33; }
    .platform { fill: #EFECF7; stroke: #D3CBE8; stroke-width: 1.5; }
    .grass { fill: #5A4A94; }
    .lv { fill: none; stroke: #D3CBE8; stroke-width: 1.5; }
    .lv-text { font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #5E5873; }
    .company { font-size: 22px; font-weight: 700; fill: #1F1A33; }
    .role { font-size: 15px; fill: #5E5873; }
    .date { font-size: 15px; font-weight: 600; fill: #5A4A94; }
    .ghost rect { fill: none; stroke: #D3CBE8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .ghost-title { font-size: 22px; font-weight: 700; letter-spacing: 2px; fill: #D3CBE8; }
    .ghost-note { font-size: 15px; font-style: italic; fill: #5E5873; }
    .hud { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #5E5873; }
    .xp-track { fill: #E2DDF0; }
    .xp-fill { fill: #F5C84C; transform-box: fill-box; transform-origin: left center; animation: xp 13s infinite; }
    .hero { animation: hero 13s infinite; }
    .bob { animation: bob .5s ease-in-out infinite alternate; }
    .gain { font-size: 16px; font-weight: 700; fill: #5A4A94; opacity: 0; animation: gain 13s linear infinite; }
    .bug-egem { transform-box: fill-box; transform-origin: center bottom; animation: squash 13s linear infinite; }
    .legs { animation: wiggle .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .lv-now { fill: #F5C84C; stroke: #F5C84C; }
    .lv-now-text { fill: #1F1A33; }
    .buff { opacity: 0; animation: buff 13s linear infinite; }
    .buff-card { fill: #EFECF7; stroke: #F5C84C; stroke-width: 2; }
    .buff-timer { fill: #F5C84C; transform-box: fill-box; transform-origin: left center; animation: timer 13s linear infinite; }
    .buff-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.8px; fill: #5A4A94; }
    .buff-title { font-size: 19px; font-weight: 700; fill: #1F1A33; }
    .buff-note { font-size: 14px; fill: #5E5873; }
    .buff-gain { font-size: 14px; font-weight: 700; fill: #5A4A94; }
    .bolt { fill: #F5C84C; }
    .aura { fill: #F5C84C; fill-opacity: .14; stroke: #F5C84C; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: aura .6s ease-in-out infinite alternate; }
    .mystery { animation: float 1.4s ease-in-out infinite alternate; }
    .mystery rect { fill: #F5C84C; stroke: #1F1A33; stroke-opacity: .25; stroke-width: 2; }
    .mystery text { font-size: 22px; font-weight: 800; fill: #1F1A33; }
    .locked { opacity: 0; animation: locked 13s linear infinite; }
    .locked text { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #D93A3F; }
    .lock-body { fill: #D93A3F; }
    .lock-arc { fill: none; stroke: #D93A3F; stroke-width: 3; }
    .bubble { opacity: 0; animation: bubble 13s linear infinite; }
    .bubble rect { fill: #EFECF7; stroke: #D3CBE8; stroke-width: 1.5; }
    .bubble text { font-size: 15px; font-weight: 600; fill: #1F1A33; }
    .dot { animation: blink 1.2s steps(1) infinite; }
    .dot:nth-of-type(2) { animation-delay: .3s; }
    .dot:nth-of-type(3) { animation-delay: .6s; }

    @keyframes hero { 0% { transform: translate(144px, 216px); opacity: 0; } 2.31% { opacity: 1; } 0.00% { transform: translate(144.0px, 216.0px); } 11.54% { transform: translate(144.0px, 216.0px); } 12.46% { transform: translate(183.0px, 175.8px); } 13.69% { transform: translate(235.0px, 141.8px); } 14.62% { transform: translate(274.0px, 131.0px); } 15.54% { transform: translate(313.0px, 132.8px); } 16.77% { transform: translate(365.0px, 154.8px); } 17.69% { transform: translate(404.0px, 186.0px); } 50.77% { transform: translate(404.0px, 186.0px); } 51.69% { transform: translate(449.0px, 145.8px); } 52.92% { transform: translate(509.0px, 111.8px); } 53.85% { transform: translate(554.0px, 101.0px); } 54.77% { transform: translate(599.0px, 102.8px); } 56.00% { transform: translate(659.0px, 124.8px); } 56.92% { transform: translate(704.0px, 156.0px); } 66.92% { transform: translate(704.0px, 156.0px); } 68.62% { transform: translate(744.0px, 122.0px); } 70.00% { transform: translate(788.0px, 114.0px); } 71.15% { transform: translate(772.0px, 126.0px); } 73.08% { transform: translate(710.0px, 156.0px); } 73.85% { transform: translate(704.0px, 156.0px); } 94.62% { transform: translate(704.0px, 156.0px); opacity: 1; } 98.46% { transform: translate(704.0px, 156.0px); opacity: 0; } 100% { transform: translate(144px, 216px); opacity: 0; } }
    @keyframes xp { 0% { transform: scaleX(.01); } 2.31% { transform: scaleX(.04); } 17.69% { transform: scaleX(.04); } 20.77% { transform: scaleX(.08); } 30.77% { transform: scaleX(.08); } 33.85% { transform: scaleX(.12); } 56.92% { transform: scaleX(.12); } 60.00% { transform: scaleX(.16); } 96.92% { transform: scaleX(.16); } 100% { transform: scaleX(.01); } }
    @keyframes gain { 0% { opacity: 0; transform: translateY(8px); } 2%, 8% { opacity: 1; transform: none; } 11%, 100% { opacity: 0; transform: translateY(-12px); } }
    @keyframes squash { 0%, 17.31% { opacity: 1; transform: none; } 18.46% { opacity: 1; transform: scaleY(.15); } 21.54%, 97% { opacity: 0; transform: scaleY(.15); } 100% { opacity: 1; transform: none; } }
    @keyframes buff { 0%, 30.77% { opacity: 0; transform: translateY(8px); } 32.69%, 47.69% { opacity: 1; transform: none; } 50.77%, 100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes timer { 0%, 32.69% { transform: none; } 47.69%, 100% { transform: scaleX(0); } }
    @keyframes aura { from { transform: scale(.94); } to { transform: scale(1.06); } }
    @keyframes wiggle { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes bob { from { transform: none; } to { transform: translateY(-3px); } }
    @keyframes float { from { transform: none; } to { transform: translateY(-6px); } }
    @keyframes locked { 0%, 69.62% { opacity: 0; transform: none; } 70.00% { opacity: 1; transform: translateX(-4px); } 70.77% { transform: translateX(4px); } 71.54% { transform: translateX(-2px); } 72.31%, 82.31% { opacity: 1; transform: none; } 84.62%, 100% { opacity: 0; } }
    @keyframes bubble { 0%, 75.38% { opacity: 0; transform: translateY(6px); } 77.69%, 93.08% { opacity: 1; transform: none; } 95.38%, 100% { opacity: 0; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: .2; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .hero { transform: translate(704px, 156px); }
      .bubble { opacity: 1; }
    }
  </style>

